<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Agent - Minimal Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
        }
        button {
            padding: 15px 30px;
            font-size: 16px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .connect { background: #28a745; color: white; }
        .disconnect { background: #dc3545; color: white; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status {
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            font-weight: 500;
        }
        .status-disconnected { background: #f8d7da; color: #721c24; }
        .status-connecting { background: #fff3cd; color: #856404; }
        .status-connected { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <h1>🎤 Voice Agent</h1>
    <div id="status" class="status-disconnected">Disconnected</div>
    
    <button id="connectBtn" class="connect" onclick="connect()">
        Connect & Talk
    </button>
    
    <button id="disconnectBtn" class="disconnect" onclick="disconnect()" disabled>
        Disconnect
    </button>

    <script type="module">
        import { Room, RoomEvent, Track } from 'https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.esm.mjs';
        
        let room = null;

        window.connect = async function() {
            try {
                // Clean up if already connected
                if (room) {
                    await disconnect();
                    await new Promise(r => setTimeout(r, 500));
                }

                // Update UI
                document.getElementById('status').textContent = 'Connecting...';
                document.getElementById('status').className = 'status-connecting';

                // Get connection details from API
                const response = await fetch('http://localhost:8000/api/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_name: 'User',
                        room_name: `room-${Date.now()}`
                    })
                });

                const { token, url } = await response.json();

                // Create room
                room = new Room();

                // Listen for agent audio
                room.on(RoomEvent.TrackSubscribed, (track) => {
                    if (track.kind === Track.Kind.Audio) {
                        track.attach();
                        console.log('Agent audio playing!');
                    }
                });

                // Update UI when connected
                room.on(RoomEvent.Connected, () => {
                    document.getElementById('status').textContent = 'Connected - Start Talking!';
                    document.getElementById('status').className = 'status-connected';
                    document.getElementById('connectBtn').disabled = true;
                    document.getElementById('disconnectBtn').disabled = false;
                });

                // Connect to LiveKit
                await room.connect(url, token);
                await room.localParticipant.setMicrophoneEnabled(true);

            } catch (error) {
                console.error('Connection error:', error);
                document.getElementById('status').textContent = 'Connection Failed';
                document.getElementById('status').className = 'status-disconnected';
            }
        }

        window.disconnect = async function() {
            if (room) {
                await room.localParticipant.setMicrophoneEnabled(false);
                await room.disconnect();
                room = null;
                
                document.getElementById('status').textContent = 'Disconnected';
                document.getElementById('status').className = 'status-disconnected';
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
            }
        }
    </script>
</body>
</html>
