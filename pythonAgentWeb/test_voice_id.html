<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Voice ID</title>
    <style>
        body {
            font-family: monospace;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .container {
            background: #252526;
            padding: 20px;
            border-radius: 10px;
        }
        h1 { color: #4ec9b0; }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #0e639c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: #1177bb; }
        .result {
            margin: 15px 0;
            padding: 15px;
            background: #1e1e1e;
            border-radius: 5px;
            border-left: 4px solid #4ec9b0;
        }
        .error { border-left-color: #f48771; }
        pre {
            background: #0d1117;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Voice ID Test</h1>
        <p>Test if voice_id is being passed correctly to the API</p>
        
        <button onclick="testCartesia()">Test Cartesia (Default)</button>
        <button onclick="testCartesiaCustom()">Test Cartesia (Custom Voice)</button>
        <button onclick="testElevenLabs()">Test ElevenLabs (Default)</button>
        <button onclick="testElevenLabsCustom()">Test ElevenLabs (Custom Voice)</button>
        
        <div id="results"></div>
    </div>

    <script>
        function addResult(title, data, isError = false) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${isError ? 'error' : ''}`;
            resultDiv.innerHTML = `
                <strong>${isError ? '❌' : '✅'} ${title}</strong>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
            resultsDiv.appendChild(resultDiv);
        }

        async function testAPI(payload, testName) {
            try {
                console.log(`Testing: ${testName}`, payload);
                
                const response = await fetch('http://localhost:8000/api/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (response.ok && data.success) {
                    addResult(testName, {
                        tts_provider: data.tts_provider,
                        voice_id: data.voice_id || 'default',
                        room: data.room,
                        identity: data.identity
                    });
                } else {
                    addResult(testName, data, true);
                }
            } catch (error) {
                addResult(testName, { error: error.message }, true);
            }
        }

        async function testCartesia() {
            document.getElementById('results').innerHTML = '';
            await testAPI({
                user_name: 'Test User',
                tts_provider: 'cartesia'
            }, 'Cartesia Default Voice');
        }

        async function testCartesiaCustom() {
            document.getElementById('results').innerHTML = '';
            await testAPI({
                user_name: 'Test User',
                tts_provider: 'cartesia',
                voice_id: '79f8b5fb-2cc8-479a-80df-29f7a7cf1a3e'
            }, 'Cartesia British Male Voice');
        }

        async function testElevenLabs() {
            document.getElementById('results').innerHTML = '';
            await testAPI({
                user_name: 'Test User',
                tts_provider: 'elevenlabs'
            }, 'ElevenLabs Default Voice');
        }

        async function testElevenLabsCustom() {
            document.getElementById('results').innerHTML = '';
            await testAPI({
                user_name: 'Test User',
                tts_provider: 'elevenlabs',
                voice_id: '21m00Tcm4TlvDq8ikWAM'
            }, 'ElevenLabs Rachel Voice');
        }
    </script>
</body>
</html>
