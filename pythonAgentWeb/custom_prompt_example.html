<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Agent - Custom Prompt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 { color: #333; }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            margin: 10px 0;
        }
        button {
            padding: 15px 30px;
            font-size: 16px;
            margin: 10px 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .connect { background: #28a745; color: white; }
        .disconnect { background: #dc3545; color: white; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status {
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            font-weight: 500;
        }
        .status-disconnected { background: #f8d7da; color: #721c24; }
        .status-connecting { background: #fff3cd; color: #856404; }
        .status-connected { background: #d4edda; color: #155724; }
        .templates {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }
        .template-btn {
            padding: 8px 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }
        .template-btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🎭 Voice Agent with Custom Prompt</h1>
    
    <p><strong>Instructions:</strong> Enter custom instructions below to change the agent's personality!</p>
    
    <div class="templates">
        <button class="template-btn" onclick="useTemplate('pirate')">🏴‍☠️ Pirate</button>
        <button class="template-btn" onclick="useTemplate('coach')">💪 Fitness Coach</button>
        <button class="template-btn" onclick="useTemplate('chef')">👨‍🍳 Chef</button>
        <button class="template-btn" onclick="useTemplate('support')">🎧 Support</button>
        <button class="template-btn" onclick="useTemplate('default')">✨ Default</button>
    </div>
    
    <textarea id="instructions" placeholder="Enter custom instructions for the agent...">You are a helpful voice AI assistant. You eagerly assist users with their questions by providing information from your extensive knowledge. Your responses are concise, to the point, and without any complex formatting or punctuation including emojis, asterisks, or other symbols. You are curious, friendly, and have a sense of humor.</textarea>
    
    <div id="status" class="status-disconnected">Disconnected</div>
    
    <button id="connectBtn" class="connect" onclick="connect()">
        Connect with Custom Prompt
    </button>
    
    <button id="disconnectBtn" class="disconnect" onclick="disconnect()" disabled>
        Disconnect
    </button>

    <script type="module">
        import { Room, RoomEvent, Track } from 'https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.esm.mjs';
        
        let room = null;

        const templates = {
            pirate: "You are a pirate captain named Captain Blackbeard. Always speak like a pirate with phrases like 'Ahoy!', 'Arr!', and 'matey'. Be enthusiastic and tell tales of the sea.",
            coach: "You are an energetic fitness coach. Motivate users with enthusiasm! Provide workout tips and healthy lifestyle advice. Always be encouraging and use phrases like 'You got this!' and 'Let's crush it!'",
            chef: "You are a friendly chef. Share cooking tips, recipes, and food knowledge. Be passionate about food and make everything sound delicious. Use culinary terms naturally.",
            support: "You are a professional customer support agent. Be polite, patient, and helpful. Always confirm you understand the issue before providing solutions. Show empathy and professionalism.",
            default: "You are a helpful voice AI assistant. You eagerly assist users with their questions by providing information from your extensive knowledge. Your responses are concise, to the point, and without any complex formatting or punctuation including emojis, asterisks, or other symbols. You are curious, friendly, and have a sense of humor."
        };

        window.useTemplate = function(type) {
            document.getElementById('instructions').value = templates[type];
        }

        window.connect = async function() {
            try {
                if (room) {
                    await disconnect();
                    await new Promise(r => setTimeout(r, 500));
                }

                const instructions = document.getElementById('instructions').value.trim();
                
                if (!instructions) {
                    alert('Please enter instructions for the agent!');
                    return;
                }

                document.getElementById('status').textContent = 'Connecting with custom prompt...';
                document.getElementById('status').className = 'status-connecting';

                // Get connection details with custom instructions
                const response = await fetch('http://localhost:8000/api/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_name: 'User',
                        room_name: `room-${Date.now()}`,
                        instructions: instructions  // ← Custom instructions!
                    })
                });

                const { token, url } = await response.json();

                // Create room
                room = new Room();

                // Listen for agent audio
                room.on(RoomEvent.TrackSubscribed, (track) => {
                    if (track.kind === Track.Kind.Audio) {
                        track.attach();
                        console.log('Agent audio playing with custom personality!');
                    }
                });

                // Update UI when connected
                room.on(RoomEvent.Connected, () => {
                    document.getElementById('status').textContent = 'Connected - Talk to your custom agent!';
                    document.getElementById('status').className = 'status-connected';
                    document.getElementById('connectBtn').disabled = true;
                    document.getElementById('disconnectBtn').disabled = false;
                });

                // Connect to LiveKit
                await room.connect(url, token);
                await room.localParticipant.setMicrophoneEnabled(true);

            } catch (error) {
                console.error('Connection error:', error);
                document.getElementById('status').textContent = 'Connection Failed: ' + error.message;
                document.getElementById('status').className = 'status-disconnected';
            }
        }

        window.disconnect = async function() {
            if (room) {
                await room.localParticipant.setMicrophoneEnabled(false);
                await room.disconnect();
                room = null;
                
                document.getElementById('status').textContent = 'Disconnected';
                document.getElementById('status').className = 'status-disconnected';
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
            }
        }
    </script>
</body>
</html>
