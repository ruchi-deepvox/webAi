<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .container {
            background: #252526;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #3e3e42;
        }
        h1 {
            color: #4ec9b0;
            margin-top: 0;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #3c3c3c;
            border: 1px solid #555;
            color: #d4d4d4;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            padding: 12px 24px;
            margin: 10px 5px 10px 0;
            background: #0e639c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        button:hover { background: #1177bb; }
        button:disabled { background: #555; cursor: not-allowed; }
        .test-result {
            margin: 15px 0;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 13px;
        }
        .pending { background: #1e3a5f; border-left: 4px solid #4ec9b0; }
        .success { background: #1e3a1e; border-left: 4px solid #4ec9b0; }
        .error { background: #3a1e1e; border-left: 4px solid #f48771; }
        .info { background: #2d2d30; border-left: 4px solid #ffd700; color: #ffd700; }
        pre {
            margin: 10px 0 0 0;
            padding: 10px;
            background: #1e1e1e;
            border-radius: 3px;
            overflow-x: auto;
            font-size: 12px;
        }
        .test-name {
            font-weight: bold;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Network Connection Tester</h1>
        <p>Use this to diagnose connectivity issues from other devices</p>
        
        <label for="serverIp">Server IP Address:</label>
        <input type="text" id="serverIp" value="192.168.0.102" placeholder="e.g., 192.168.0.102">
        
        <label for="serverPort">Server Port:</label>
        <input type="text" id="serverPort" value="8000" placeholder="8000">
        
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="clearResults()">Clear Results</button>
        
        <div id="results"></div>
    </div>

    <script>
        function addResult(testName, status, message, details = null) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${status}`;
            
            let statusIcon = status === 'success' ? '✅' : status === 'error' ? '❌' : '⏳';
            
            let html = `<div class="test-name">${statusIcon} ${testName}</div>`;
            html += `<div>${message}</div>`;
            
            if (details) {
                html += `<pre>${details}</pre>`;
            }
            
            resultDiv.innerHTML = html;
            resultsDiv.appendChild(resultDiv);
            
            // Scroll to bottom
            window.scrollTo(0, document.body.scrollHeight);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function runAllTests() {
            clearResults();
            
            const ip = document.getElementById('serverIp').value.trim();
            const port = document.getElementById('serverPort').value.trim();
            const baseUrl = `http://${ip}:${port}`;
            
            addResult('Configuration', 'info', `Testing server at: ${baseUrl}`);
            
            // Test 1: Health Check
            await testHealthCheck(baseUrl);
            
            // Test 2: API Documentation
            await testApiDocs(baseUrl);
            
            // Test 3: Connect Endpoint
            await testConnect(baseUrl);
            
            addResult('Tests Complete', 'info', 'All tests finished. Check results above.');
        }

        async function testHealthCheck(baseUrl) {
            try {
                addResult('Test 1: Health Check', 'pending', 'Checking if server is reachable...');
                
                const response = await fetch(`${baseUrl}/api/health`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    addResult(
                        'Test 1: Health Check', 
                        'success', 
                        `Server is online and healthy! Status: ${data.status}`,
                        JSON.stringify(data, null, 2)
                    );
                } else {
                    addResult(
                        'Test 1: Health Check', 
                        'error', 
                        `Server returned error: ${response.status}`,
                        JSON.stringify(data, null, 2)
                    );
                }
            } catch (error) {
                addResult(
                    'Test 1: Health Check', 
                    'error', 
                    `Failed to connect to server. Error: ${error.message}`,
                    `Possible causes:
1. Firewall is blocking port ${baseUrl.split(':')[2]}
2. Server is not running
3. Wrong IP address (${baseUrl.split(':')[1].replace('//', '')})
4. Not on the same network

Fix:
- On server machine, run as Administrator:
  netsh advfirewall firewall add rule name="Python API Server" dir=in action=allow protocol=TCP localport=8000`
                );
            }
        }

        async function testApiDocs(baseUrl) {
            try {
                addResult('Test 2: API Documentation', 'pending', 'Fetching API documentation...');
                
                const response = await fetch(`${baseUrl}/api`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                
                if (response.ok && data.name) {
                    addResult(
                        'Test 2: API Documentation', 
                        'success', 
                        `API documentation accessible. Version: ${data.version}`,
                        `API Name: ${data.name}\nDescription: ${data.description}`
                    );
                } else {
                    addResult(
                        'Test 2: API Documentation', 
                        'error', 
                        'Failed to fetch API documentation'
                    );
                }
            } catch (error) {
                addResult(
                    'Test 2: API Documentation', 
                    'error', 
                    `Connection failed: ${error.message}`
                );
            }
        }

        async function testConnect(baseUrl) {
            try {
                addResult('Test 3: Connect Endpoint', 'pending', 'Testing agent connection...');
                
                const response = await fetch(`${baseUrl}/api/connect`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        room_name: `test-room-${Date.now()}`,
                        user_name: 'Test User',
                        instructions: 'You are a test agent.'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success && data.token) {
                    addResult(
                        'Test 3: Connect Endpoint', 
                        'success', 
                        'Successfully generated access token! Connection is working!',
                        `Room: ${data.room}\nIdentity: ${data.identity}\nToken: ${data.token.substring(0, 50)}...`
                    );
                } else {
                    addResult(
                        'Test 3: Connect Endpoint', 
                        'error', 
                        'Failed to connect to agent',
                        JSON.stringify(data, null, 2)
                    );
                }
            } catch (error) {
                addResult(
                    'Test 3: Connect Endpoint', 
                    'error', 
                    `Connection failed: ${error.message}`
                );
            }
        }

        // Auto-run tests on load if requested
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('autorun') === 'true') {
            window.addEventListener('load', runAllTests);
        }
    </script>
</body>
</html>
