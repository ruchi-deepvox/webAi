<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Agent - Complete UI Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 { color: #333; text-align: center; }
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .connect-btn {
            background: #28a745;
            color: white;
        }
        .connect-btn:hover { background: #218838; }
        .connect-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .disconnect-btn {
            background: #dc3545;
            color: white;
        }
        .disconnect-btn:hover { background: #c82333; }
        .status {
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: 500;
        }
        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }
        .status.connecting {
            background: #fff3cd;
            color: #856404;
        }
        .status.connected {
            background: #d4edda;
            color: #155724;
        }
        .log {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 13px;
            font-family: monospace;
        }
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #ddd;
        }
        .info { color: #0066cc; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Voice Agent UI</h1>
        
        <div id="status" class="status disconnected">
            Status: Disconnected
        </div>

        <button id="connectBtn" class="connect-btn" onclick="connectToAgent()">
            🎤 Connect & Talk to Agent
        </button>
        
        <button id="disconnectBtn" class="disconnect-btn" onclick="disconnect()" disabled>
            🔇 Disconnect
        </button>

        <div class="log" id="log">
            <div class="log-entry info">Ready to connect...</div>
        </div>
    </div>

    <script type="module">
        import { Room, RoomEvent, Track } from 'https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.esm.mjs';
        
        let room = null;

        window.log = function(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        window.updateStatus = function(message, state) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${state}`;
            statusDiv.textContent = `Status: ${message}`;
        }

        window.connectToAgent = async function() {
            try {
                // If already connected, disconnect first
                if (room) {
                    window.log('⚠️ Already connected, disconnecting first...', 'info');
                    await window.disconnect();
                    // Wait a bit for clean disconnect
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
                
                window.updateStatus('Connecting...', 'connecting');
                window.log('🔄 Step 1: Calling API to get connection details...', 'info');

                // STEP 1: Call your unified API with a unique room each time
                const response = await fetch('http://localhost:8000/api/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_name: 'John',
                        user_id: `user-${Date.now()}`,
                        // Generate new room name each time for fresh connection
                        room_name: `room-${Date.now()}`
                    })
                });

                const data = await response.json();
                
                window.log('✅ Got response from API', 'success');
                window.log(`   Token: ${data.token.substring(0, 20)}...`, 'info');
                window.log(`   URL: ${data.url}`, 'info');
                window.log(`   Room: ${data.room} (NEW ROOM)`, 'info');

                // STEP 2: Create LiveKit Room
                window.log('🔄 Step 2: Creating LiveKit room...', 'info');
                room = new Room({
                    adaptiveStream: true,
                    dynacast: true,
                });

                // STEP 3: Set up event listeners
                window.log('🔄 Step 3: Setting up event listeners...', 'info');
                
                // Listen for when we successfully connect
                room.on(RoomEvent.Connected, () => {
                    window.log('✅ Connected to LiveKit!', 'success');
                    window.updateStatus('Connected - Start talking!', 'connected');
                });

                // Listen for agent audio
                room.on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    window.log(`📡 Track received from ${participant.identity}`, 'info');
                    
                    if (track.kind === Track.Kind.Audio) {
                        window.log('🔊 Agent audio track received!', 'success');
                        
                        // Attach audio to play agent's voice
                        const audioElement = track.attach();
                        audioElement.autoplay = true;
                        audioElement.play().then(() => {
                            window.log('🎵 Agent audio is now playing!', 'success');
                        }).catch(err => {
                            window.log(`⚠️ Audio play error: ${err.message}`, 'error');
                        });
                    }
                });

                // Listen for new participants (the agent)
                room.on(RoomEvent.ParticipantConnected, (participant) => {
                    window.log(`👤 Participant joined: ${participant.identity}`, 'success');
                });

                // STEP 4: Connect using token and URL from API
                window.log('🔄 Step 4: Connecting to LiveKit server...', 'info');
                await room.connect(data.url, data.token);
                
                // STEP 5: Enable your microphone
                window.log('🔄 Step 5: Enabling microphone...', 'info');
                await room.localParticipant.setMicrophoneEnabled(true);
                window.log('🎤 Microphone enabled - You can now speak!', 'success');

                // Update UI
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;

                window.log('✅ All set! Start talking to the agent!', 'success');

            } catch (error) {
                window.log(`❌ Error: ${error.message}`, 'error');
                window.updateStatus('Connection Failed', 'disconnected');
                console.error('Full error:', error);
            }
        }

        window.disconnect = async function() {
            if (room) {
                window.log('🔄 Disconnecting...', 'info');
                
                try {
                    // Disable microphone first
                    await room.localParticipant.setMicrophoneEnabled(false);
                    
                    // Disconnect from room
                    await room.disconnect();
                    
                    // Clear the room reference
                    room = null;
                    
                    window.updateStatus('Disconnected', 'disconnected');
                    window.log('✅ Disconnected successfully', 'success');
                } catch (error) {
                    window.log(`⚠️ Disconnect error: ${error.message}`, 'error');
                    room = null; // Force clear even on error
                }
                
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
            }
        }
    </script>
</body>
</html>
