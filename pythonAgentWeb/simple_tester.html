<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Voice Agent Tester</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .status-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border-left: 4px solid #ddd;
        }

        .status-card.disconnected {
            border-left-color: #dc3545;
            background: #fff5f5;
        }

        .status-card.connecting {
            border-left-color: #ffc107;
            background: #fffbf0;
        }

        .status-card.connected {
            border-left-color: #28a745;
            background: #f0fff4;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 16px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ddd;
        }

        .status-card.disconnected .status-dot {
            background: #dc3545;
        }

        .status-card.connecting .status-dot {
            background: #ffc107;
        }

        .status-card.connected .status-dot {
            background: #28a745;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .log-container {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            margin-top: 20px;
        }

        .log-entry {
            margin-bottom: 5px;
        }

        .log-entry.info { color: #4ec9b0; }
        .log-entry.success { color: #6a9955; }
        .log-entry.error { color: #f48771; }

        .tip {
            background: #e7f3ff;
            border-left: 4px solid #2196f3;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            color: #555;
        }

        #remoteAudio {
            width: 0;
            height: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Voice Agent Tester</h1>
        <p class="subtitle">Simple interface to test your LiveKit agent</p>

        <div id="statusCard" class="status-card disconnected">
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </div>

        <div class="form-group">
            <label for="roomName">Room Name (optional)</label>
            <input type="text" id="roomName" placeholder="Leave empty for auto-generation">
        </div>

        <div class="button-group">
            <button id="connectBtn" class="btn-primary" onclick="connect()">
                🎤 Connect & Talk
            </button>
            <button id="disconnectBtn" class="btn-danger" onclick="disconnect()" disabled>
                🔇 Disconnect
            </button>
        </div>

        <div class="log-container" id="logContainer">
            <div class="log-entry info">[Ready] Click "Connect & Talk" to begin</div>
        </div>

        <div class="tip">
            <strong>💡 Requirements:</strong><br>
            1. Agent: <code>uv run python src/agent.py dev</code><br>
            2. Token Server: <code>uv run python token_server.py</code>
        </div>

        <audio id="remoteAudio" autoplay></audio>
    </div>

    <script type="module">
        import { Room, RoomEvent, Track } from 'https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.esm.mjs';
        
        let room = null;

        window.log = function(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        window.updateStatus = function(status, state) {
            const statusCard = document.getElementById('statusCard');
            const statusText = document.getElementById('statusText');
            statusCard.className = `status-card ${state}`;
            statusText.textContent = status;
        }

        window.connect = async function() {
            try {
                let roomName = document.getElementById('roomName').value.trim();
                if (!roomName) {
                    roomName = `test-room-${Date.now()}`;
                    document.getElementById('roomName').value = roomName;
                }

                updateStatus('Connecting...', 'connecting');
                log('Requesting token from server...', 'info');

                // Get token from token server
                const response = await fetch(`http://localhost:5000/token?room=${roomName}&identity=web-user`);
                if (!response.ok) {
                    throw new Error('Token server not responding. Make sure token_server.py is running!');
                }

                const { token, url } = await response.json();
                log('Token received, connecting to LiveKit...', 'info');

                // Create room
                room = new Room({
                    adaptiveStream: true,
                    dynacast: true,
                });

                // Set up event listeners
                room.on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    log(`Subscribed to ${participant.identity}'s ${track.kind}`, 'success');
                    
                    if (track.kind === Track.Kind.Audio) {
                        const audioElement = track.attach();
                        audioElement.autoplay = true;
                        audioElement.play().then(() => {
                            log('🔊 Agent audio is playing!', 'success');
                        }).catch(err => {
                            log(`Audio play error: ${err.message}. Click anywhere to enable audio.`, 'error');
                        });
                    }
                });

                room.on(RoomEvent.Connected, () => {
                    log('Connected to room successfully!', 'success');
                    updateStatus('Connected - Start talking!', 'connected');
                });

                room.on(RoomEvent.Disconnected, () => {
                    log('Disconnected from room', 'info');
                    updateStatus('Disconnected', 'disconnected');
                    document.getElementById('connectBtn').disabled = false;
                    document.getElementById('disconnectBtn').disabled = true;
                });

                room.on(RoomEvent.ParticipantConnected, (participant) => {
                    log(`Participant joined: ${participant.identity}`, 'success');
                });

                // Connect to room
                await room.connect(url, token);

                // Enable microphone
                await room.localParticipant.setMicrophoneEnabled(true);
                log('🎤 Microphone enabled - you can speak now!', 'success');

                // Update UI
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;

            } catch (error) {
                log(`Error: ${error.message}`, 'error');
                updateStatus('Connection Failed', 'disconnected');
                console.error(error);
            }
        }

        window.disconnect = async function() {
            if (room) {
                await room.disconnect();
                room = null;
                log('Manually disconnected', 'info');
            }
        }
    </script>
</body>
</html>
